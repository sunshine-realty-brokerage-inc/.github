name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include passwords, tokens, or client personal information.**
        For security vulnerabilities, follow the Security Policy instead of opening an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local development
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser / device / OS
      placeholder: e.g. Chrome 130 on Windows 11, Safari on iPhone 15
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any sensitive information first.
      render: shell
